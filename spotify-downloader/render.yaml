services:
  - type: web
    name: moodify
    runtime: python
    plan: free
    buildCommand: |
      pip install flask gunicorn spotdl yt-dlp Pillow
      python -m spotdl --download-ffmpeg
    startCommand: gunicorn web_app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 300
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
